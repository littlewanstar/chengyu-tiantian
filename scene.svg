<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2745"/>
      <stop offset="0.45" stop-color="#3f5380"/>
      <stop offset="0.72" stop-color="#b8798a"/>
      <stop offset="0.86" stop-color="#e9a77c"/>
      <stop offset="1" stop-color="#f3c590"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f6dcc8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a55"/>
      <stop offset="1" stop-color="#132a33"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a2e"/>
      <stop offset="1" stop-color="#1d1519"/>
    </linearGradient>
    <radialGradient id="win" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#e9a64a"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="390" height="844" fill="url(#sky)"/>

  <!-- 星 -->
  <g fill="#fff7dc">
    <circle cx="32" cy="46" r="1.2"/><circle cx="78" cy="96" r="1"/><circle cx="130" cy="38" r="1.3"/>
    <circle cx="176" cy="84" r="0.9"/><circle cx="224" cy="30" r="1.1"/><circle cx="262" cy="70" r="1"/>
    <circle cx="352" cy="44" r="1.3"/><circle cx="366" cy="104" r="0.9"/><circle cx="18" cy="150" r="1"/>
    <circle cx="104" cy="168" r="0.8"/><circle cx="198" cy="160" r="0.9"/><circle cx="58" cy="226" r="0.8"/>
  </g>

  <!-- 月 -->
  <circle cx="296" cy="304" r="104" fill="url(#moonGlow)"/>
  <circle cx="296" cy="304" r="46" fill="#fbefc4"/>
  <circle cx="310" cy="294" r="40" fill="#f3dfa6" opacity="0.55"/>
  <circle cx="282" cy="318" r="7" fill="#e8d296" opacity="0.6"/>
  <circle cx="308" cy="326" r="4.5" fill="#e8d296" opacity="0.55"/>

  <rect x="0" y="760" width="390" height="84" fill="#132a33"/>
  <g transform="translate(0,-60)">
  <!-- 远山(最淡) -->
  <path d="M0 470 L40 430 L78 458 L128 396 L176 450 L228 410 L280 452 L330 418 L390 456 L390 560 L0 560 Z" fill="#7d83a6" opacity="0.85"/>
  <!-- 雾带 1 -->
  <rect x="0" y="440" width="390" height="70" fill="url(#mist)"/>
  <!-- 中山 -->
  <path d="M0 520 L36 480 L86 512 L142 452 L206 510 L262 470 L322 508 L390 474 L390 600 L0 600 Z" fill="#56608a"/>
  <!-- 雾带 2 -->
  <rect x="0" y="488" width="390" height="80" fill="url(#mist)"/>
  <!-- 近山 -->
  <path d="M0 580 L48 540 L104 574 L160 520 L220 572 L286 534 L344 570 L390 546 L390 720 L0 720 Z" fill="#2a4351"/>

  <!-- 书院(小山岗上) -->
  <path d="M40 668 Q120 600 200 612 Q300 600 360 668 L360 700 L40 700 Z" fill="#2a4351"/>
  <!-- 台基 -->
  <rect x="104" y="628" width="182" height="14" fill="#4a3a3c"/>
  <rect x="96" y="640" width="198" height="10" fill="#5a484a"/>
  <!-- 主厅立柱与墙 -->
  <rect x="124" y="580" width="142" height="48" fill="#3a2c30"/>
  <rect x="132" y="584" width="8" height="44" fill="#6b3a30"/>
  <rect x="190" y="584" width="8" height="44" fill="#6b3a30"/>
  <rect x="250" y="584" width="8" height="44" fill="#6b3a30"/>
  <!-- 窗光 -->
  <rect x="146" y="594" width="38" height="28" rx="2" fill="url(#win)"/>
  <rect x="206" y="594" width="38" height="28" rx="2" fill="url(#win)"/>
  <path d="M165 594 V622 M146 608 H184 M225 594 V622 M206 608 H244" stroke="#6b3a30" stroke-width="1.6"/>
  <!-- 主屋顶:飞檐 -->
  <path d="M96 584 Q130 578 196 552 Q262 578 296 584 Q270 586 196 566 Q122 586 96 584 Z" fill="url(#roof)"/>
  <path d="M110 586 L282 586 L262 568 Q196 548 130 568 Z" fill="#241a1e"/>
  <!-- 上层小顶 -->
  <path d="M148 560 Q176 556 196 532 Q216 556 244 560 Q220 560 196 546 Q172 560 148 560 Z" fill="url(#roof)"/>
  <rect x="168" y="546" width="56" height="16" fill="#3a2c30"/>
  <rect x="188" y="550" width="16" height="12" rx="1" fill="url(#win)"/>
  <!-- 屋脊小饰 -->
  <circle cx="196" cy="530" r="3" fill="#d9a73a"/>

  <!-- 灯笼 -->
  <g>
    <path d="M120 650 V626" stroke="#2b1c1c" stroke-width="1.5"/>
    <ellipse cx="120" cy="660" rx="9" ry="11" fill="#c8452f"/>
    <rect x="115" y="648" width="10" height="3" fill="#d9a73a"/>
    <path d="M270 650 V626" stroke="#2b1c1c" stroke-width="1.5"/>
    <ellipse cx="270" cy="660" rx="9" ry="11" fill="#c8452f"/>
    <rect x="265" y="648" width="10" height="3" fill="#d9a73a"/>
  </g>

  <!-- 左侧松树 -->
  <g fill="#173a3a">
    <rect x="46" y="610" width="6" height="56" fill="#2a1f1f"/>
    <path d="M28 640 L49 596 L70 640 Z"/>
    <path d="M22 616 L49 566 L76 616 Z"/>
    <path d="M30 592 L49 540 L68 592 Z"/>
  </g>
  <!-- 右侧松树(稍小) -->
  <g fill="#173a3a">
    <rect x="340" y="624" width="5" height="44" fill="#2a1f1f"/>
    <path d="M326 650 L342 614 L358 650 Z"/>
    <path d="M322 630 L342 590 L362 630 Z"/>
    <path d="M328 606 L342 566 L356 606 Z"/>
  </g>

  <!-- 竹 -->
  <g stroke="#1f4a3c" stroke-width="3" stroke-linecap="round">
    <path d="M300 700 V610"/><path d="M312 700 V622"/><path d="M290 700 V626"/>
  </g>
  <g stroke="#2e6a54" stroke-width="3">
    <path d="M296 640 h8 M296 668 h8 M308 650 h8 M308 680 h8 M286 650 h8 M286 676 h8"/>
  </g>
  <g fill="#2e6a54">
    <path d="M300 612 q22 -8 30 -2 q-16 8 -30 2 Z"/><path d="M312 624 q-20 -10 -30 -4 q14 10 30 4 Z"/>
    <path d="M290 628 q-20 -6 -26 2 q14 6 26 -2 Z"/>
  </g>

  <!-- 前景地面:留给按钮的安静区域 -->
  <path d="M0 690 Q90 660 200 676 Q310 660 390 690 L390 904 L0 904 Z" fill="url(#ground)"/>
  <!-- 石板小路 -->
  <path d="M176 676 Q196 700 150 760 Q120 800 90 904 L260 904 Q240 790 224 750 Q214 700 214 676 Z" fill="#3e5b63" opacity="0.55"/>
  <g fill="#ffffff" opacity="0.07">
    <ellipse cx="192" cy="700" rx="16" ry="4"/><ellipse cx="178" cy="738" rx="22" ry="5"/>
    <ellipse cx="166" cy="782" rx="28" ry="6"/><ellipse cx="150" cy="826" rx="34" ry="7"/>
  </g>
  <!-- 前景雾 -->
  <rect x="0" y="650" width="390" height="60" fill="url(#mist)"/>
</g>
</svg>
